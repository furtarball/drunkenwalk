name: Build AppImage and release if on main

on:
  push:
  pull_request:

env:
  DEBIAN_FRONTEND: noninteractive
  ARTFNAME: &artfname Drunken_Walk-x86_64.AppImage

jobs:
  build:
    # old distro = old glibc = AppImage will run on most Linux PC's
    runs-on: ubuntu-24.04
    steps:
    - name: Install tools and depedencies
      run: |
        sudo apt-get update
        sudo apt-get install meson libsdl2-dev libsdl2-ttf-dev libsdl2-image-dev nlohmann-json3-dev
    - name: Check out
      uses: actions/checkout@v7
    - name: Set up Meson
      run: |
        mkdir builddir
        meson setup builddir
        meson configure -Dprefix=/usr builddir
    - name: Build
      run: meson install -C builddir --destdir ../AppDir
    - name: Download AppImage tools
      run: |
        wget https://github.com/linuxdeploy/linuxdeploy/releases/latest/download/linuxdeploy-x86_64.AppImage
        chmod +x linuxdeploy-x86_64.AppImage
        wget https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/latest/download/linuxdeploy-plugin-appimage-x86_64.AppImage
        chmod +x linuxdeploy-plugin-appimage-x86_64.AppImage
    - name: Build AppImage
      run: ./linuxdeploy-x86_64.AppImage --appdir AppDir --output appimage
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        path: *artfname
        archive: "false"
        if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
    - name: Download build output
      uses: actions/download-artifact@v8
    - name: Create release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        wget -q https://github.com/TheAssassin/pyuploadtool/releases/download/continuous/pyuploadtool-x86_64.AppImage
        chmod +x pyuploadtool-x86_64.AppImage
        ./pyuploadtool-x86_64.AppImage "$ARTFNAME"
